<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내게 맞는 대회 찾기 — 4단계 선택으로 추천받기 — calrank</title>
<meta name="description" content="종목·거리·지역·시기를 선택하면 calrank 실제 대회 데이터베이스에서 맞춤 대회를 즉시 추천해주는 인터랙티브 도구입니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="내게 맞는 대회 찾기">
<meta property="og:description" content="4단계 선택으로 실제 대회를 추천받으세요.">
<meta property="og:image" content="https://calrank.vercel.app/og-image.png">
<meta property="og:url" content="https://calrank.vercel.app/race-finder-quiz.html">
<meta property="og:locale" content="ko_KR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="style.css">
<style>
  .quiz-wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 90px; }
  .column-meta { font-size: 13px; color: var(--ink-faint, #6A6A6A); margin-bottom: 12px; }
  .quiz-title { font-family: var(--font-display); font-size: clamp(24px, 3.6vw, 32px); line-height: 1.3; margin-bottom: 8px; }
  .quiz-sub { font-size: 14.5px; color: #B8B0AC; margin-bottom: 28px; }

  .step-dots { display: flex; gap: 6px; margin-bottom: 32px; }
  .step-dot { flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.1); transition: background 0.3s ease; }
  .step-dot.done { background: var(--accent); }

  .quiz-step { display: none; animation: stepIn 0.3s ease; }
  .quiz-step.active { display: block; }
  @keyframes stepIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
  .quiz-question { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 18px; }
  .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .quiz-options { grid-template-columns: 1fr; } }
  .quiz-option { background: var(--surface, #141414); border: 1.5px solid var(--border, #2A2A2A); border-radius: 12px; padding: 16px; text-align: left; cursor: pointer; transition: border-color 0.15s ease, transform 0.12s ease; }
  .quiz-option:hover { border-color: rgba(255,107,74,0.5); transform: translateY(-1px); }
  .quiz-option .opt-emoji { font-size: 20px; margin-bottom: 6px; display: block; }
  .quiz-option .opt-label { font-size: 14.5px; font-weight: 700; color: #fff; }

  .quiz-back { display: inline-block; margin-top: 20px; font-size: 13px; color: var(--ink-faint, #6A6A6A); cursor: pointer; text-decoration: underline; }

  .result-loading { text-align: center; padding: 40px 0; color: var(--ink-faint, #6A6A6A); font-size: 14px; }
  .result-title { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 6px; }
  .result-sub { font-size: 13.5px; color: #B8B0AC; margin-bottom: 20px; }
  .result-card { display: block; background: var(--surface, #141414); border: 1px solid var(--border, #2A2A2A); border-radius: 10px; padding: 16px 18px; margin-bottom: 10px; text-decoration: none; }
  .result-card:hover { border-color: var(--accent); }
  .result-card-name { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .result-card-meta { font-size: 12.5px; color: var(--ink-faint, #6A6A6A); }
  .result-empty { text-align: center; padding: 30px 0; color: var(--ink-faint, #6A6A6A); font-size: 14px; }
  .retry-btn { display: inline-block; margin-top: 18px; background: var(--accent); color: #fff; font-weight: 700; padding: 11px 22px; border-radius: 6px; text-decoration: none; font-size: 13.5px; cursor: pointer; border: none; }
</style>
</head>
<body>

<header class="site-header">
<div class="wrap header-inner">
<a href="index.html" class="wordmark">CALRANK</a>
<nav class="main-nav">
<a href="index.html" class="nav-link">캘린더</a>
<a href="regions.html" class="nav-link">지역별</a>
<a href="news.html" class="nav-link">종목뉴스</a>
<a href="column.html" class="nav-link">칼럼</a>
<a href="myrank.html" class="nav-link">내 랭크</a>
<a href="contact.html" class="nav-contact-link">제휴문의</a>
</nav>
</div>
</header>

<main class="quiz-wrap">
<p class="column-meta">🎯 인터랙티브 도구</p>
<h1 class="quiz-title">내게 맞는 대회 찾기</h1>
<p class="quiz-sub">4가지만 골라주세요. calrank가 보유한 실제 대회 데이터에서 바로 추천해드립니다.</p>

<div class="step-dots" id="stepDots"></div>

<div class="quiz-step active" data-step="0">
<p class="quiz-question">Q1. 어떤 종목에 관심 있으세요?</p>
<div class="quiz-options">
<button class="quiz-option" data-key="sport" data-value="marathon"><span class="opt-emoji">🏃</span><span class="opt-label">마라톤</span></button>
<button class="quiz-option" data-key="sport" data-value="trail"><span class="opt-emoji">⛰️</span><span class="opt-label">트레일러닝</span></button>
<button class="quiz-option" data-key="sport" data-value="cycling"><span class="opt-emoji">🚴</span><span class="opt-label">자전거</span></button>
<button class="quiz-option" data-key="sport" data-value="triathlon"><span class="opt-emoji">🏊</span><span class="opt-label">철인3종</span></button>
</div>
</div>

<div class="quiz-step" data-step="1">
<p class="quiz-question">Q2. 선호하는 거리는요?</p>
<div class="quiz-options">
<button class="quiz-option" data-key="distBucket" data-value="short"><span class="opt-emoji">🟢</span><span class="opt-label">짧게 (~10km)</span></button>
<button class="quiz-option" data-key="distBucket" data-value="mid"><span class="opt-emoji">🟡</span><span class="opt-label">중간 (10~25km)</span></button>
<button class="quiz-option" data-key="distBucket" data-value="long"><span class="opt-emoji">🟠</span><span class="opt-label">길게 (25~50km)</span></button>
<button class="quiz-option" data-key="distBucket" data-value="any"><span class="opt-emoji">⚪</span><span class="opt-label">상관없어요</span></button>
</div>
<a class="quiz-back" data-back>← 이전 질문</a>
</div>

<div class="quiz-step" data-step="2">
<p class="quiz-question">Q3. 선호하는 지역은요?</p>
<div class="quiz-options">
<button class="quiz-option" data-key="region" data-value="서울"><span class="opt-emoji">🏙️</span><span class="opt-label">서울·수도권</span></button>
<button class="quiz-option" data-key="region" data-value="강원"><span class="opt-emoji">🏔️</span><span class="opt-label">강원</span></button>
<button class="quiz-option" data-key="region" data-value="영남"><span class="opt-emoji">🌊</span><span class="opt-label">영남권</span></button>
<button class="quiz-option" data-key="region" data-value="any"><span class="opt-emoji">🌏</span><span class="opt-label">상관없어요</span></button>
</div>
<a class="quiz-back" data-back>← 이전 질문</a>
</div>

<div class="quiz-step" data-step="3">
<p class="quiz-question">Q4. 언제쯤 참가하고 싶으세요?</p>
<div class="quiz-options">
<button class="quiz-option" data-key="timing" data-value="30"><span class="opt-emoji">⚡</span><span class="opt-label">한 달 안에</span></button>
<button class="quiz-option" data-key="timing" data-value="90"><span class="opt-emoji">📅</span><span class="opt-label">3개월 안에</span></button>
<button class="quiz-option" data-key="timing" data-value="365"><span class="opt-emoji">🗓️</span><span class="opt-label">올해 안에</span></button>
<button class="quiz-option" data-key="timing" data-value="any"><span class="opt-emoji">⏳</span><span class="opt-label">상관없어요</span></button>
</div>
<a class="quiz-back" data-back>← 이전 질문</a>
</div>

<div class="quiz-step" data-step="4">
<div id="resultArea"></div>
</div>

</main>

<footer class="site-footer">
<div class="wrap">
<p>calrank는 대회 주최측이 공개한 일정 정보를 정리해 제공합니다. 접수 조건 등 정확한 내용은 신청 페이지에서 다시 확인해주세요.</p>
</div>
</footer>

<script>
(function() {
  const answers = {};
  let currentStep = 0;
  const totalSteps = 4;
  const steps = document.querySelectorAll('.quiz-step');
  const dotsWrap = document.getElementById('stepDots');

  for (let i = 0; i < totalSteps; i++) {
    const dot = document.createElement('div');
    dot.className = 'step-dot';
    dotsWrap.appendChild(dot);
  }

  function updateDots() {
    document.querySelectorAll('.step-dot').forEach((d, i) => d.classList.toggle('done', i < currentStep));
  }

  function goToStep(n) {
    currentStep = n;
    steps.forEach(s => s.classList.toggle('active', Number(s.dataset.step) === n));
    updateDots();
    if (n === totalSteps) runSearch();
  }

  document.querySelectorAll('.quiz-option').forEach(btn => {
    btn.addEventListener('click', () => {
      answers[btn.dataset.key] = btn.dataset.value;
      goToStep(currentStep + 1);
    });
  });

  document.querySelectorAll('[data-back]').forEach(el => {
    el.addEventListener('click', () => goToStep(Math.max(0, currentStep - 1)));
  });

  const DIST_KEYWORDS = {
    short: ["5km", "10km"],
    mid: ["하프", "21", "20km", "30km"],
    long: ["풀", "42", "50km", "40km"],
  };

  function distMatch(distances, bucket) {
    if (bucket === "any") return true;
    const keywords = DIST_KEYWORDS[bucket] || [];
    return distances.some(d => keywords.some(k => d.includes(k)));
  }

  function regionMatch(region, wanted) {
    if (wanted === "any") return true;
    if (wanted === "서울") return region === "서울" || region === "경기" || region === "인천";
    if (wanted === "강원") return region === "강원";
    if (wanted === "영남") return ["부산","대구","울산","경남","경북"].includes(region);
    return true;
  }

  async function runSearch() {
    const resultArea = document.getElementById('resultArea');
    resultArea.innerHTML = '<p class="result-loading">calrank 대회 데이터베이스에서 찾는 중...</p>';

    let events = [];
    try {
      const res = await fetch('events.json');
      events = await res.json();
    } catch (e) {
      resultArea.innerHTML = '<p class="result-empty">대회 정보를 불러오지 못했어요. 잠시 후 다시 시도해주세요.</p>';
      return;
    }

    const today = new Date();
    const maxDays = answers.timing === "any" ? Infinity : Number(answers.timing);

    const matched = events.filter(ev => {
      if (ev.sport !== answers.sport) return false;
      if (!distMatch(ev.distances || [], answers.distBucket)) return false;
      if (!regionMatch(ev.region, answers.region)) return false;
      const evDate = new Date(ev.date);
      const diffDays = (evDate - today) / (1000 * 60 * 60 * 24);
      if (diffDays < 0) return false;
      if (diffDays > maxDays) return false;
      return true;
    }).sort((a, b) => new Date(a.date) - new Date(b.date)).slice(0, 5);

    if (matched.length === 0) {
      resultArea.innerHTML = `
        <p class="result-title">😅 딱 맞는 대회를 못 찾았어요</p>
        <p class="result-sub">조건에 맞는 대회가 아직 없거나 접수 정보가 준비 중일 수 있어요. 조건을 조금 넓혀서 다시 찾아보세요.</p>
        <button class="retry-btn" id="retryBtn">처음부터 다시 찾기</button>
      `;
    } else {
      const cards = matched.map(ev => `
        <a href="event.html?id=${encodeURIComponent(ev.id)}" class="result-card">
          <p class="result-card-name">${ev.name}</p>
          <p class="result-card-meta">${ev.date} · ${ev.location || ev.region}</p>
        </a>
      `).join("");
      resultArea.innerHTML = `
        <p class="result-title">🎉 ${matched.length}개의 대회를 찾았어요</p>
        <p class="result-sub">가까운 날짜순으로 정리했어요.</p>
        ${cards}
        <button class="retry-btn" id="retryBtn">다른 조건으로 다시 찾기</button>
      `;
    }

    document.getElementById('retryBtn').addEventListener('click', () => {
      Object.keys(answers).forEach(k => delete answers[k]);
      goToStep(0);
    });
  }

  updateDots();
})();
</script>

</body>
</html>

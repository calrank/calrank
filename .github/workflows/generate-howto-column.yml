name: Generate howto column

# scripts/generate_howto_column.py가 tips_bank.json(사전 조사·집필된
# 마라톤·트레일·자전거·철인3종 "고민 기반" 노하우, 실제 출처 포함)에서
# 아직 발행하지 않은 조합을 하나씩 순환 발행한다. 실시간 AI 생성이 아니라
# 콘텐츠 뱅크 로테이션이라 API 비용이 들지 않는다.

on:
  schedule:
    - cron: "0 22 */3 * *" # 3일마다 07:00 KST
  workflow_dispatch:
    inputs:
      regenerate:
        description: "체크하면 새 글 발행 없이, 이미 발행된 칼럼만 최신 템플릿으로 다시 굽습니다"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate howto column
        run: |
          if [ "${{ github.event.inputs.regenerate }}" = "true" ]; then
            python scripts/generate_howto_column.py --regenerate-published
          else
            python scripts/generate_howto_column.py
          fi

      - name: Sync navigation
        run: python scripts/sync_nav.py

      - name: Sync favicon declarations
        run: python scripts/sync_icons.py

      - name: Commit if changed
        run: |
          git config user.name "calrank-bot"
          git config user.email "bot@calrank.local"
          git add column-howto-*.html column.html sitemap.xml scripts/howto_state.json
          git add -u
          git diff --quiet --cached && echo "변경 없음" && exit 0
          # 바뀐 파일 목록을 남겨 IndexNow 단계가 읽게 한다.
          # checkout 이 커밋 1개만 받아와서 git diff HEAD~1 은 쓸 수 없다.
          git diff --name-only --cached > "$RUNNER_TEMP/changed_files.txt"
          git commit -m "chore: auto-publish howto column" && git push

      - name: Notify IndexNow
        # 이 워크플로가 방금 바꾼 페이지를 네이버·Bing 에 알린다.
        # 그동안 update-events.yml 만 알리고 있었다. 여기서 만드는
        # 등급표·칼럼·랜딩 페이지는 사이트맵에만 올라가고 아무에게도
        # 알리지 않아, 색인이 늦거나 아예 안 되는 채로 남아 있었다.
        # 구글은 IndexNow 를 지원하지 않으므로 구글 쪽은 사이트맵에 기댄다.
        # 실패해도 생성 결과를 버리지 않도록 continue-on-error 로 둔다.
        continue-on-error: true
        env:
          CHANGED_FILES: ${{ runner.temp }}/changed_files.txt
        run: python scripts/ping_indexnow.py

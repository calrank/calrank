name: Generate distance landing pages

# scripts/generate_distance_landing_pages.py가 events.json 기준 "종목 x 거리"
# 조합 중 데이터가 충분한(5개 이상) 조합마다 정적 SEO 랜딩페이지를 만든다.
# "10km 마라톤 대회", "하프마라톤 대회 일정" 같은 실제 검색어를 노린다.

on:
  schedule:
    - cron: "0 19 * * 1" # 매주 월요일 04:00 KST (지역별 랜딩페이지와 같은 주기)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate distance landing pages
        run: python scripts/generate_distance_landing_pages.py

      - name: Commit if changed
        run: |
          git config user.name "calrank-bot"
          git config user.email "bot@calrank.local"
          git add landing-dist-*.html distances.html sitemap.xml
          git diff --quiet --cached || (git commit -m "chore: regenerate distance landing pages" && git push)

name: GSC Performance

# 서치 콘솔 검색 성과를 매일 가져와 Supabase 에 쌓는다. 저장소에는 아무것도 쓰지 않는다(배포 없음).
# 처음 한 번은 Run workflow 에서 days 를 90 으로 넣어 과거를 채운다.
on:
  schedule:
    - cron: "7 22 * * *"   # 매일 07:07 KST
  workflow_dispatch:
    inputs:
      days:
        description: "끝에서 며칠 전까지 받을지 (처음 채울 때 90)"
        required: false
        default: "7"

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - name: 검색 성과 수집
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GSC_DAYS: ${{ github.event.inputs.days || '7' }}
        run: |
          echo "### 서치 콘솔 검색 성과" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/gsc_perf.py | tee -a "$GITHUB_STEP_SUMMARY"

name: Site Health

# 사이트 자가점검. 저장소에는 아무것도 쓰지 않으므로 Vercel 배포를 일으키지 않는다.
# 치명 항목(깨진 내부 링크, 사이트맵 페이지의 noindex, canonical 불일치,
# 크롤러 판별 회귀 등)이 있으면 실행이 실패하고 GitHub 가 알림을 보낸다.

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 KST
  push:
    branches: [main]
    paths: ["index.html", "scripts/site_health.py", ".github/workflows/site-health.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 점검 실행
        run: |
          set +e
          python3 scripts/site_health.py --json > health.json
          code=$?
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("health.json"))
          print(f"### 사이트 자가점검 — 사이트맵 {r['sitemap_urls']}개 / HTML {r['html_files']}개")
          for c in r["critical"][:50]: print(f"- ✗ {c}")
          for w in r["warnings"]: print(f"- △ {w}")
          if not r["critical"]: print("- ✓ 치명 항목 없음")
          PY
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-health
          path: health.json
          retention-days: 14

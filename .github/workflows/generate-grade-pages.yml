name: Generate grade pages

# scripts/generate_grade_pages.py가 거리 4종 x 성별 2종 등급표 8개와 허브 1개를 만든다.
# 표의 경계값은 level.js(계산기)와 같은 모델로 계산하며, 스크립트가 실행 전에
# level.js 상수를 직접 대조해 어긋나면 중단한다.
# 등급표는 events.json과 무관하므로 매일 돌릴 필요가 없고,
# level.js나 생성 스크립트가 바뀔 때 + 주 1회만 갱신한다.

on:
  push:
    branches: [main]
    paths:
      - "level.js"
      - "scripts/generate_grade_pages.py"
  schedule:
    - cron: "10 20 * * 1" # 매주 월요일 05:10 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate grade pages
        run: python scripts/generate_grade_pages.py

      - name: Sync navigation
        run: python scripts/sync_nav.py

      - name: Sync favicon declarations
        run: python scripts/sync_icons.py

      - name: Commit if changed
        run: |
          git config user.name "calrank-bot"
          git config user.email "bot@calrank.local"
          git add grade.html grade-*.html sitemap.xml
          git add -u
          git diff --quiet --cached && echo "변경 없음" && exit 0
          # 바뀐 파일 목록을 남겨 IndexNow 단계가 읽게 한다.
          # checkout 이 커밋 1개만 받아와서 git diff HEAD~1 은 쓸 수 없다.
          git diff --name-only --cached > "$RUNNER_TEMP/changed_files.txt"
          git commit -m "chore: update grade tables" && git pull --rebase && git push

      - name: Notify IndexNow
        # 이 워크플로가 방금 바꾼 페이지를 네이버·Bing 에 알린다.
        # 그동안 update-events.yml 만 알리고 있었다. 여기서 만드는
        # 등급표·칼럼·랜딩 페이지는 사이트맵에만 올라가고 아무에게도
        # 알리지 않아, 색인이 늦거나 아예 안 되는 채로 남아 있었다.
        # 구글은 IndexNow 를 지원하지 않으므로 구글 쪽은 사이트맵에 기댄다.
        # 실패해도 생성 결과를 버리지 않도록 continue-on-error 로 둔다.
        continue-on-error: true
        env:
          CHANGED_FILES: ${{ runner.temp }}/changed_files.txt
        run: python scripts/ping_indexnow.py

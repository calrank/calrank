name: Update official records

# scripts/fetch_official_records.py가 대회 주최측이 공개한 수상자 명단을
# 매주 자동으로 수집합니다. (경기 결과는 대회 후 게시되므로 이벤트/뉴스보다
# 낮은 빈도로 충분합니다.)

on:
  schedule:
    - cron: "0 21 * * 0"  # 매주 일요일 06:00 KST
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch official records
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_official_records.py

name: Probe Trekking Files

# 한국등산트레킹지원센터 둘레길 GPX 파일데이터가 자동으로 내려받아지는지 한 번 확인한다. 로그에만 남는다.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_trekking_files.py

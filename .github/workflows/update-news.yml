name: Update news data

# scripts/fetch_news.py가 e-마라톤·대한사이클연맹·대한철인뎄3종협회의
# 공식 뉴스 게시판을 매일 자동으로 수집합니다.

on:
  schedule:
    - cron: "0 21 * * *"  # 매일 06:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch news
        run: python scripts/fetch_news.py --out news.json

      - name: Commit if changed
        run: |
          git config user.name "calrank-bot"
          git config user.email "bot@calrank.local"
          git diff --quiet news.json || (git add news.json && git commit -m "chore: update news.json" && git push)

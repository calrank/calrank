name: Update events data

# scripts/fetch_events.py에 roadrun.co.kr 실제 크롤링 로직이 들어가 있습니다.
# workflow_dispatch 수동 실행으로 이미 성공을 확인했습니다 — 이제 매일 자동으로 돌아갑니다.

on:
  schedule:
    - cron: "0 21 * * *"  # 매일 06:00 KST
  workflow_dispatch:
    inputs:
      indexnow_range:
        description: "IndexNow 로 다시 보낼 커밋 범위 (예: HEAD~30..HEAD). 비우면 이번 커밋만."
        required: false
        default: ""

# 두 실행이 겹치면 같은 생성 파일을 동시에 고쳐 병합 충돌이 난다.
# (2026-10-12 에 실제로 feed-*.ics 에서 충돌이 나 그 실행이 통째로 버려졌다)
# 한 번에 하나만 돌리고, 나머지는 기다리게 한다.
concurrency:
  group: update-events
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 전체 이력을 받아온다. 0 을 조건식으로 고르려 했다가
          # ${{ inputs.x && 0 || 1 }} 에서 0 이 거짓으로 취급돼 항상 1 이 되는
          # 함정에 걸렸다. 저장소가 크지 않으니 그냥 전부 받는다.
          # push 거절 뒤 rebase 도 이력이 있어야 제대로 된다.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch events
        run: python scripts/fetch_events.py --out events.json

      - name: Generate static event pages
        # events.json의 대회마다 내용이 미리 채워진 정적 페이지(e/<id>.html)를 만든다.
        # 검색엔진이 자바스크립트 없이도 대회 정보를 읽을 수 있게 하기 위함.
        run: python scripts/generate_event_pages.py

      - name: Generate topic pages
        # 울트라마라톤·야간런·걷기·어린이 마라톤·접수중 — 경쟁이 적은 검색어의
        # 도착 페이지를 events.json 기준으로 다시 만든다.
        run: python scripts/generate_topic_pages.py

      - name: Generate aquathlon page
        # 아쿠아슬론 시즌 정리 페이지(aquathlon.html)를 최신 events.json 기준으로 다시 만든다.
        # 새 대회가 등록되면 예정 대회 표에 자동으로 올라간다.
        run: python scripts/generate_aquathlon_page.py

      - name: Sync navigation
        # 목차는 scripts/site_nav.py 한 곳에만 적혀 있다. 생성기가 만든 페이지든
        # 손으로 만든 페이지든 매일 여기서 다시 맞춘다. 전에는 생성기마다 목차를
        # 따로 적어 두어 114개 페이지에 8종류가 돌아다녔다.
        run: python scripts/sync_nav.py

      - name: Commit if changed
        run: |
          git config user.name "calrank-bot"
          git config user.email "bot@calrank.local"
          git add events.json sitemap-events.xml feed.ics feed-*.ics
          git add event_aliases.json vercel.json
          git add index.html
          git add e/ aquathlon.html
          git add events-index.html events-archive.html sitemap.xml
          git add open-registration.html ultra-marathon.html night-run.html
          git add walking-events.html kids-marathon.html
          git add -u          # 목차 동기화 등으로 바뀐 기존 파일
          git diff --quiet --cached && echo "변경 없음" && exit 0
          # 바뀐 파일 목록을 남겨 IndexNow 단계가 읽게 한다.
          # checkout 이 커밋 1개만 받아와서 git diff HEAD~1 은 쓸 수 없다.
          git diff --name-only --cached > "$RUNNER_TEMP/changed_files.txt"
          git commit -m "chore: update events.json"
          # 같은 시각에 사람이 커밋하면 push 가 "fetch first" 로 거절된다.
          # 거기서 그냥 멈추면 그날 수집한 대회 데이터가 조용히 버려진다
          # (2026-10-08 예약 실행이 실제로 이렇게 실패했다).
          # 원격 변경 위로 다시 쌓아 올려 세 번까지 재시도한다.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 거절됨 ($i/3) — 원격 변경을 받아 다시 올립니다"
            if ! git pull --rebase --autostash origin main; then
              # 생성 파일이 양쪽에서 바뀌면 충돌한다. 어설프게 합치면 깨진 파일이
              # 올라가므로 되돌리고 실패로 끝낸다. 다음 실행이 처음부터 다시 만든다.
              git rebase --abort || true
              echo "원격 변경과 충돌했습니다. 이번 실행은 버리고 다음 실행에 맡깁니다."
              exit 1
            fi
          done
          git push

      - name: Notify IndexNow
        # 방금 커밋에서 바뀐 페이지를 네이버·Bing 에 알린다.
        # 구글 서치콘솔의 수동 색인 요청은 하루 10여 건이 한도라 수백 개
        # 페이지를 따라갈 수 없다. IndexNow 는 요청당 1만 건까지 받고
        # 하루 횟수 제한이 없다. (구글은 IndexNow 를 지원하지 않는다)
        # 실패해도 수집 결과를 버리지 않도록 continue-on-error 로 둔다.
        continue-on-error: true
        env:
          CHANGED_FILES: ${{ runner.temp }}/changed_files.txt
        run: python scripts/ping_indexnow.py "${{ inputs.indexnow_range }}"

name: Update events data

# scripts/fetch_events.py에 roadrun.co.kr 실제 크롤링 로직이 들어가 있습니다.
# 첫 수동 실행에서 크롤링 자체는 성공했으나(events.json 변경 감지됨),
# github-actions[bot]의 기본 권한이 읽기 전용이라 push가 403으로 거부되었습니다.
# 아래 permissions 블록으로 쓰기 권한을 명시적으로 부여합니다.
#
# 이 \"Fetch events\" 단계가 workflow_dispatch(수동 실행)로 정상 작동하는 것을 확인한 뒤에,
# 아래 schedule 주석을 해제하면 매일 자동화됩니다.
#
# on:
#   schedule:
#     - cron: "0 21 * * *"  # 매일 06:00 KST
#   workflow_dispatch: {}

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch events
        run: python scripts/fetch_events.py --out events.json

      - name: Commit if changed
        run: |
          git config user.name "calrank-bot"
          git config user.email "bot@calrank.local"
          git diff --quiet events.json || (git add events.json && git commit -m "chore: update events.json" && git push)

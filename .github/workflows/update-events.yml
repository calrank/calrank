name: Update events data

# scripts/fetch_events.py에 roadrun.co.kr 실제 크롤링 로직이 들어가 있습니다.
# workflow_dispatch 수동 실행으로 이미 성공을 확인했습니다 — 이제 매일 자동으로 돌아갑니다.

on:
  schedule:
    - cron: "0 21 * * *"  # 매일 06:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch events
        run: python scripts/fetch_events.py --out events.json

      - name: Commit if changed
        run: |
          git config user.name "calrank-bot"
          git config user.email "bot@calrank.local"
          git diff --quiet events.json || (git add events.json && git commit -m "chore: update events.json" && git push)

name: Build Trailroot courses

# 두루누비 코스를 받아 data/courses.json 을 갱신하고 코스 페이지를 다시 만든다.
# 인증키는 로그에 나오지 않는다. GPX 원본은 저장하지 않는다.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "10 19 1 * *" # 매달 1일 04:10 KST

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch courses
        run: node scripts/build_trailroot_data.js
        env:
          DURUNUBI_API_KEY: ${{ secrets.DURUNUBI_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "calrank-bot"
          git config user.email "bot@calrank.local"
          git add data/courses.json
          git diff --quiet --cached || (git commit -m "data: update trailroot courses" && git pull --rebase && git push)

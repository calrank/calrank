name: Fetch gear prices

# scripts/fetch_gear_prices.py가 네이버 쇼핑 검색 API로 러닝화 등 장비의
# 실시간 최저가를 매일 수집해 gear_prices.json으로 저장한다.
# NAVER_CLIENT_ID / NAVER_CLIENT_SECRET는 저장소 Secrets에 등록되어 있어야 하며,
# 등록 전까지는 스크립트가 조용히 스킵하도록 되어 있다.

on:
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch gear prices
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/fetch_gear_prices.py

      - name: Commit if changed
        run: |
          # 네이버 API 키가 없으면 스크립트가 파일을 만들지 않고 그냥 끝난다.
          # 그때 git add 가 pathspec 오류로 죽어서 10/21 부터 엿새 내리 빨간불이었다.
          # 받아온 게 없으면 조용히 넘어가야, 진짜 고장이 났을 때 그게 눈에 띈다.
          if [ ! -f gear_prices.json ]; then
            echo "gear_prices.json 이 없습니다 — NAVER_CLIENT_ID/NAVER_CLIENT_SECRET 미등록으로 보입니다."
            echo "키를 등록하면 이 단계가 자동으로 다시 동작합니다. 커밋 없이 끝냅니다."
            exit 0
          fi
          git config user.name "calrank-bot"
          git config user.email "bot@calrank.local"
          git add gear_prices.json
          git diff --quiet --cached || (git commit -m "chore: update gear prices" && git push)

name: Generate science column

# scripts/science_columns.json 에 쌓아 둔 근거 기반 칼럼을 한 번에 한 편씩 발행합니다.
# 한꺼번에 올리면 하루 반짝하고 끝나지만, 하나씩 내보내면 색인이 꾸준히 늘고
# 칼럼 목록도 계속 갱신됩니다. 대기 중인 글이 없으면 아무것도 하지 않습니다.
#
# 글을 추가하려면 scripts/science_columns.json 의 articles 배열에 항목을 넣으면 됩니다.
# 본문의 신체 관련 주장에는 references 에 정의된 PubMed 논문을 각주로 달아야 합니다.

on:
  schedule:
    - cron: "0 22 * * 2,5" # 화·금 07:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate science column
        run: python scripts/generate_science_column.py

      - name: Sync navigation
        run: python scripts/sync_nav.py

      - name: Sync favicon declarations
        run: python scripts/sync_icons.py

      - name: Commit if changed
        run: |
          git config user.name "calrank-bot"
          git config user.email "bot@calrank.local"
          git add column-running-*.html column.html sitemap.xml scripts/science_column_state.json
          git add -u
          git diff --quiet --cached && echo "변경 없음" && exit 0
          # 바뀐 파일 목록을 남겨 IndexNow 단계가 읽게 한다.
          # checkout 이 커밋 1개만 받아와서 git diff HEAD~1 은 쓸 수 없다.
          git diff --name-only --cached > "$RUNNER_TEMP/changed_files.txt"
          git commit -m "chore: publish science column" && git push

      - name: Notify IndexNow
        # 이 워크플로가 방금 바꾼 페이지를 네이버·Bing 에 알린다.
        # 그동안 update-events.yml 만 알리고 있었다. 여기서 만드는
        # 등급표·칼럼·랜딩 페이지는 사이트맵에만 올라가고 아무에게도
        # 알리지 않아, 색인이 늦거나 아예 안 되는 채로 남아 있었다.
        # 구글은 IndexNow 를 지원하지 않으므로 구글 쪽은 사이트맵에 기댄다.
        # 실패해도 생성 결과를 버리지 않도록 continue-on-error 로 둔다.
        continue-on-error: true
        env:
          CHANGED_FILES: ${{ runner.temp }}/changed_files.txt
        run: python scripts/ping_indexnow.py

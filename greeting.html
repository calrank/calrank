<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>calrank — 너의 다음 출발선</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B0B;
    --panel: #141110;
    --accent: #FF3D1A;
    --ink-soft: #B8B0AC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: #fff;
    font-family: 'Noto Sans KR', sans-serif;
    overflow-x: hidden;
  }
  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 640px;
    overflow: hidden;
  }
  .bg-slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center 30%;
    opacity: 0;
    transform: scale(1.08);
    animation: slideshow 28s infinite;
  }
  .bg-slide::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, rgba(11,11,11,0.96) 0%, rgba(11,11,11,0.75) 32%, rgba(11,11,11,0.15) 58%, rgba(11,11,11,0.35) 100%);
  }
  .bg-slide:nth-child(1) { background-image: url('duo1.jpg'); animation-delay: 0s; }
  .bg-slide:nth-child(2) { background-image: url('duo2.jpg'); animation-delay: 4s; }
  .bg-slide:nth-child(3) { background-image: url('duo3.jpg'); animation-delay: 8s; }
  .bg-slide:nth-child(4) { background-image: url('duo4.jpg'); animation-delay: 12s; }
  .bg-slide:nth-child(5) { background-image: url('duo5.jpg'); animation-delay: 16s; background-position: center 40%; }
  .bg-slide:nth-child(6) { background-image: url('duo6.jpg'); animation-delay: 20s; background-position: center 20%; }
  .bg-slide:nth-child(7) { background-image: url('duo7.jpg'); animation-delay: 24s; background-position: center 25%; }

  @keyframes slideshow {
    0%      { opacity: 0; transform: scale(1.08); }
    1.8%    { opacity: 1; transform: scale(1.08); }
    12%     { opacity: 1; transform: scale(1.13); }
    15%     { opacity: 0; transform: scale(1.13); }
    100%    { opacity: 0; }
  }

  .diag-panel {
    position: absolute;
    inset: 0;
    clip-path: polygon(0 0, 62% 0, 38% 100%, 0 100%);
    background: linear-gradient(160deg, #0B0B0B 0%, #161311 100%);
  }

  .content {
    position: relative;
    z-index: 3;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 6vw 0 6vw 6vw;
    max-width: 620px;
  }

  .wordmark {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(28px, 3.4vw, 40px);
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 28px;
  }

  .headline {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(40px, 6.2vw, 76px);
    line-height: 1.08;
    color: #fff;
  }
  .headline .em { color: var(--accent); }

  .sub {
    margin-top: 22px;
    font-size: clamp(15px, 1.3vw, 18px);
    line-height: 1.7;
    color: var(--ink-soft);
    max-width: 440px;
  }

  .sport-row {
    margin-top: 34px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .sport-chip {
    font-size: 13px;
    padding: 7px 16px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    color: #E8E4E1;
  }

  .cta {
    margin-top: 40px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    width: fit-content;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    padding: 16px 30px;
    border-radius: 6px;
    text-decoration: none;
  }

  .progress-dots {
    position: absolute;
    left: 6vw;
    bottom: 6vw;
    z-index: 3;
    display: flex;
    gap: 8px;
  }
  .progress-dots span {
    width: 26px;
    height: 3px;
    background: rgba(255,255,255,0.22);
    overflow: hidden;
    position: relative;
  }
  .progress-dots span::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    animation: fillDot 28s infinite;
  }
  .progress-dots span:nth-child(1)::after { animation-delay: 0s; }
  .progress-dots span:nth-child(2)::after { animation-delay: 4s; }
  .progress-dots span:nth-child(3)::after { animation-delay: 8s; }
  .progress-dots span:nth-child(4)::after { animation-delay: 12s; }
  .progress-dots span:nth-child(5)::after { animation-delay: 16s; }
  .progress-dots span:nth-child(6)::after { animation-delay: 20s; }
  .progress-dots span:nth-child(7)::after { animation-delay: 24s; }
  @keyframes fillDot {
    0% { transform: scaleX(0); }
    1.8% { transform: scaleX(0); }
    13.5% { transform: scaleX(1); }
    15% { transform: scaleX(1); }
    100% { transform: scaleX(1); }
  }

  @media (max-width: 720px) {
    .diag-panel { clip-path: polygon(0 0, 100% 0, 100% 62%, 0 88%); }
    .content { max-width: 100%; padding: 8vw 6vw; justify-content: flex-end; height: 62%; }
    .progress-dots { bottom: auto; top: 4vw; }
  }
</style>
</head>
<body>

<section class="hero">
  <div class="bg-slide"></div>
  <div class="bg-slide"></div>
  <div class="bg-slide"></div>
  <div class="bg-slide"></div>
  <div class="bg-slide"></div>
  <div class="bg-slide"></div>
  <div class="bg-slide"></div>

  <div class="diag-panel"></div>

  <div class="content">
    <div class="wordmark">CALRANK</div>
    <h1 class="headline">너의 다음<br><span class="em">출발선</span>, 여기.</h1>
    <p class="sub">마라톤, 자전거, 트레일러닝, 철인3종, 인라인 — 흩어진 국내 동호인 대회를 한곳에 모았습니다. 접수 마감일부터 완주 기록까지.</p>
    <div class="sport-row">
      <span class="sport-chip">마라톤</span>
      <span class="sport-chip">자전거</span>
      <span class="sport-chip">트레일</span>
      <span class="sport-chip">철인3종</span>
      <span class="sport-chip">인라인</span>
    </div>
    <a class="cta" href="index.html">대회 찾아보기 →</a>
  </div>

  <div class="progress-dots">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
</section>

</body>
</html>

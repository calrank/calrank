<section class="hero">
<h1>대회 정보 제보하기</h1>
<p class="hero-sub">calrank에 아직 없는 대회를 알고 계신가요? 알려주시면 확인 후 캘린더에 반영해드립니다.</p>
</section>

<section id="loginRequiredNotice" class="auth-card" style="display:none;">
<p class="auth-reassure">제보하려면 로그인이 필요합니다. <a href="myrank.html" style="color:inherit;">내 랭크 페이지에서 로그인</a>해주세요.</p>
</section>

<section id="submitFormSection" class="record-form-card" style="display:none;">
<form id="submitEventForm" class="record-form">
<input type="text" id="seName" placeholder="대회명 (필수)" required>
<select id="seSport">
<option value="marathon">마라톤</option>
<option value="cycling">자전거</option>
<option value="trail">트레일</option>
<option value="triathlon">철인3종</option>
<option value="inline">인라인</option>
<option value="etc">기타</option>
</select>
<div style="display:flex; gap:4px; margin-bottom:8px;">
<select id="seYear" style="flex:1.2;"></select>
<select id="seMonth" style="flex:1;"></select>
<select id="seDay" style="flex:1;"></select>
</div>
<input type="text" id="seLocation" placeholder="장소">
<input type="text" id="seRegion" placeholder="지역 (예: 서울, 부산)">
<input type="url" id="seApplyUrl" placeholder="신청/공식 페이지 URL">
<input type="text" id="seNotes" placeholder="추가 메모 (선택)">
<button type="submit" class="record-submit-btn">제보하기</button>
</form>
<p class="record-msg" id="submitMsg"></p>
</section>

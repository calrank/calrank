<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대회 정보 제보하기 — calrank</title>
<meta name="description" content="calrank에 없는 대회 정보를 알려주세요. 확인 후 캘린더에 반영해드립니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="myrank.css">
</head>
<body>

<header class="site-header">
<div class="wrap header-inner">
<a href="index.html" class="wordmark">CALRANK</a>
<nav class="main-nav">
<a href="index.html" class="nav-link">캘린더</a>
<a href="ranking.html" class="nav-link">대회랭킹</a>
<a href="news.html" class="nav-link">종목뉴스</a>
<a href="myrank.html" class="nav-link">내 랭크</a>
<a href="contact.html" class="nav-contact-link">제휴문의</a>
</nav>
</div>
</header>

<main class="wrap myrank-wrap">

<section class="hero">
<h1>대회 정보 제보하기</h1>
<p class="hero-sub">calrank에 아직 없는 대회를 알고 계신가요? 알려주시면 확인 후 캘린더에 반영해드립니다.</p>
</section>

<section id="loginRequiredNotice" class="auth-card" style="display:none;">
<p class="auth-reassure">제보하려면 로그인이 필요합니다. <a href="myrank.html" style="color:inherit;">내 랭크 페이지에서 로그인</a>해주세요.</p>
</section>

<section id="submitFormSection" class="record-form-card" style="display:none;">
<form id="submitEventForm" class="record-form">
<input type="text" id="seName" placeholder="대회명 (필수)" required>
<select id="seSport">
<option value="marathon">마라톤</option>
<option value="cycling">자전거</option>
<option value="trail">트레일</option>
<option value="triathlon">철인3종</option>
<option value="etc">기타</option>
</select>
<input type="date" id="seDate">
<input type="text" id="seLocation" placeholder="장소">
<input type="text" id="seRegion" placeholder="지역 (예: 서울, 부산)">
<input type="url" id="seApplyUrl" placeholder="신청/공식 페이지 URL">
<input type="text" id="seNotes" placeholder="추가 메모 (선택)">
<button type="submit" class="record-submit-btn">제보하기</button>
</form>
<p class="record-msg" id="submitMsg"></p>
</section>

</main>

<footer class="site-footer">
<div class="wrap">
<p>제보해주신 정보는 검토 후 반영되며, 반영까지 다소 시간이 걸릴 수 있습니다.</p>
<p class="footer-links"><a href="terms.html">이용약관</a> · <a href="privacy.html">개인정보처리방침</a> · <a href="contact.html">제휴·광고 문의</a></p>
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="submit-event.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
